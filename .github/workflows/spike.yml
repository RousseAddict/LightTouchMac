# Phase 0 of the Big Sur port: can a GitHub-hosted Xcode build upstream at all, and can it target macOS 11? Runs by
# hand; the job summary and the spike-* artifacts are the result.
name: Phase 0 spike

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to probe (blank for the newest)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      OUT: ${{ github.workspace }}/spike-out
    steps:
      - name: Check out the port layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: port

      - name: Pick the upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          tag="$WANTED"
          [ -n "$tag" ] || tag=$(gh release view --repo samhenrigold/LightTouchMac --json tagName --jq .tagName)
          echo "Upstream tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out upstream at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samhenrigold/LightTouchMac
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          path: src

      - name: Select the newest Xcode
        run: |
          xcode=$(python3 -I -c 'import glob, re; print(max(glob.glob("/Applications/Xcode_*.app"), key=lambda p: [int(n) for n in re.findall(r"\d+", p)]))')
          sudo xcode-select -s "$xcode"
          echo "Selected $xcode"

      - name: Install Homebrew libimobiledevice
        run: brew install libimobiledevice libplist

      - name: Probe the toolchain
        run: bash port/spike/probe-toolchain.sh src

      - name: Compile upstream as is
        run: bash port/spike/compile.sh src upstream

      - name: Compile at MACOSX_DEPLOYMENT_TARGET=11.0
        run: bash port/spike/compile.sh src lowered MACOSX_DEPLOYMENT_TARGET=11.0

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "# ${{ matrix.runner }}, upstream ${{ steps.tag.outputs.tag }}"
            echo '```'
            sed -n '/== xcode/,/== SDK deployment targets/p;/== back-deployed/,/== availability/p' "$OUT/probe.txt"
            echo '```'
            cat "$OUT"/summary-*.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the spike results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-${{ matrix.runner }}
          path: spike-out/
