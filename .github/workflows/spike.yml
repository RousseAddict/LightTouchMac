# Phase 0 of the Big Sur port: which compiler builds upstream on a GitHub-hosted Mac, and can it target macOS 11? Runs
# by hand. Results are in the job summaries, in each job's notice annotations (spike/read-results.py reads them
# without signing in) and in the spike-* artifacts.
#
# Upstream builds with Xcode 27 (Swift 6.4), which GitHub's runners don't have. Each job pairs a runner's newest Xcode
# with either its own compiler or swift.org's Swift 6.4.1 toolchain. The macos-26 job (Xcode 26.6, Swift 6.3.3) often
# waits for capacity; the macos-15 jobs carry the answer.
name: Phase 0 spike

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to probe (blank for the newest)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  spike:
    name: spike (${{ matrix.runner }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            toolchain: xcode
          - runner: macos-15
            toolchain: swift-6.4.1-RELEASE
          - runner: macos-26
            toolchain: xcode
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      OUT: ${{ github.workspace }}/spike-out
      LABEL: ${{ matrix.runner }} ${{ matrix.toolchain }}
    steps:
      - name: Check out the port layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: port

      - name: Pick the upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          tag="$WANTED"
          [ -n "$tag" ] || tag=$(gh release view --repo samhenrigold/LightTouchMac --json tagName --jq .tagName)
          echo "Upstream tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out upstream at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samhenrigold/LightTouchMac
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          path: src

      - name: Select the newest Xcode
        run: |
          xcode=$(python3 -I -c 'import glob, re; print(max(glob.glob("/Applications/Xcode_*.app"), key=lambda p: [int(n) for n in re.findall(r"\d+", p)]))')
          sudo xcode-select -s "$xcode"
          echo "Selected $xcode"

      - name: Install the swift.org toolchain
        if: matrix.toolchain != 'xcode'
        run: bash port/spike/install-toolchain.sh "${{ matrix.toolchain }}"

      - name: Prepare Xcode
        run: |
          # Keep building the targets that don't depend on a failed one, so one run reports more modules.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          # Upstream's project is in Xcode 27's format (objectVersion 110); 77 opens in Xcode 26 and builds.
          sed -i '' -E 's/objectVersion = 1[0-9]{2};/objectVersion = 77;/' src/LightTouchMac.xcodeproj/project.pbxproj
          brew install libimobiledevice libplist

      - name: Probe the toolchain
        run: bash port/spike/probe-toolchain.sh src

      - name: Compile upstream as is
        run: bash port/spike/compile.sh src upstream

      - name: Compile at MACOSX_DEPLOYMENT_TARGET=11.0
        run: bash port/spike/compile.sh src lowered MACOSX_DEPLOYMENT_TARGET=11.0

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "# $LABEL, upstream ${{ steps.tag.outputs.tag }}"
            echo '```'
            sed -n '/== xcode/,/== SDK deployment targets/p;/== back-deployed/,/== availability/p' "$OUT/probe.txt"
            echo '```'
            cat "$OUT"/summary-*.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the results as annotations
        if: always()
        run: python3 -I port/spike/annotate.py "$LABEL" "$OUT/probe.txt" "$OUT"/summary-*.md

      - name: Upload the spike results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-${{ matrix.runner }}-${{ matrix.toolchain }}
          path: spike-out/
